<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CES 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WE-Meet CES 2027</title>
<style id="gate-css">
@font-face{font-family:'Pretendard';font-weight:45 920;font-display:swap;
  src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
html,body{margin:0;height:100%;background:#0B1238}
body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
#gate{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:calc(56px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));box-sizing:border-box;color:#fff;background:#0B1238}
.wrap{max-width:420px;width:100%;margin:0 auto}
.px{display:flex;gap:3px;margin-bottom:28px}.px i{width:4px;height:20px;border-radius:2px}
.px i:nth-child(1){background:#FF4D5E}.px i:nth-child(2){background:#20C77A}.px i:nth-child(3){background:#4C8DFF}
.eyebrow{font-size:14px;color:#A9B3E8;font-weight:600}
h1{font-size:32px;line-height:1.25;margin:8px 0 0;font-weight:800;letter-spacing:-.03em}
.sub{color:#A9B3E8;font-size:16px;line-height:1.5;margin:8px 0 0}
.formw{margin-top:40px}
label{display:block;font-size:14px;color:#C9D0F2;margin-bottom:8px;font-weight:600}
input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:16px;border-radius:14px;border:1px solid #2A3470;background:#121A4A;color:#fff;outline:none;letter-spacing:.04em}
input:focus{border-color:#4C7BFF;box-shadow:0 0 0 3px rgba(76,123,255,.25)}
button{margin-top:12px;width:100%;font:inherit;font-size:17px;font-weight:700;height:54px;border:0;border-radius:14px;background:#2253F5;color:#fff;cursor:pointer}
button:active{background:#1A43CF}
.err{min-height:22px;margin-top:12px;color:#FF9AA5;font-size:14.5px}
.foot{font-size:13px;color:#7D87C4;line-height:1.6;max-width:420px;margin:0 auto;width:100%}
.loading{font-size:15px;color:#A9B3E8;margin-top:40px}
</style>
</head>
<body>
<div id="gate">
  <div class="wrap">
    <div class="px" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="eyebrow">차세대디스플레이 혁신융합대학사업단</div>
    <h1>WE-Meet in<br>CES 2027</h1>
    <p class="sub">참가자 안내 · 2027.1.5 – 1.12</p>
    <div id="form" class="formw" hidden>
      <form id="f" autocomplete="off">
        <label for="pw">안내받은 비밀번호를 입력하세요</label>
        <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
        <button type="submit">열기</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </div>
    <p class="loading" id="loading">여는 중</p>
  </div>
  <p class="foot">한 번 열면 이 휴대폰에서는 다음부터 바로 열리고, 인터넷이 없어도 볼 수 있어요.</p>
</div>
<script>
(() => {
  const KEY = 'wm.key'
  const $ = (id) => document.getElementById(id)
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  const toB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
  const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})

  let encP = null
  const getEnc = () => (encP ||= fetch('app.enc', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('load'); return r.json() }))

  async function decryptWith(key, enc) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(enc.iv) }, key, fromB64(enc.ct))
    return JSON.parse(new TextDecoder().decode(pt))
  }
  function run(p) {
    document.getElementById('gate-css')?.remove() // 잠금 화면 전용 스타일이 앱 화면에 섞이지 않게
    document.querySelector('meta[name=theme-color]')?.setAttribute('content', '#ffffff')
    const st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st)
    document.body.innerHTML = '<div id="app"></div>'
    const sc = document.createElement('script'); sc.textContent = p.js; document.body.appendChild(sc)
  }
  function showForm(msg) {
    $('loading').hidden = true; $('form').hidden = false; $('err').textContent = msg || ''
    setTimeout(() => $('pw').focus(), 50)
  }

  async function boot() {
    let enc
    try { enc = await getEnc() } catch (e) { $('loading').textContent = '내용을 불러오지 못했어요. 인터넷 연결 후 다시 열어주세요.'; return }
    const saved = store.get(KEY)
    if (saved) {
      try {
        const key = await crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt'])
        return run(await decryptWith(key, enc))
      } catch (e) { store.del(KEY) }
    }
    showForm()
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault()
    const pw = $('pw').value.trim()
    $('err').textContent = '확인 중…'
    try {
      const enc = await getEnc()
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(enc.salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
      const p = await decryptWith(key, enc)
      store.set(KEY, toB64(await crypto.subtle.exportKey('raw', key)))
      run(p)
    } catch (e) {
      $('err').textContent = '비밀번호가 맞지 않아요. 다시 확인해 주세요.'
      $('pw').select()
    }
  })
  boot()
})()
</script>
</body>
</html>
