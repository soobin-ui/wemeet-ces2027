<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070C34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CES 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WE-Meet CES 2027</title>
<style>
@font-face{font-family:'Pretendard';font-weight:45 920;font-display:swap;
  src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
html,body{margin:0;height:100%;background:#070C34}
body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
#gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));box-sizing:border-box;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,#1f3fd1 0%,rgba(31,63,209,0) 60%),radial-gradient(90% 60% at 0% 100%,#3a1a9e 0%,rgba(58,26,158,0) 60%),#070C34}
.wrap{max-width:400px;width:100%;margin:0 auto}
.px{display:flex;gap:3px;margin-bottom:22px}.px i{width:6px;height:22px;border-radius:2px}
.px i:nth-child(1){background:#ff4d5e}.px i:nth-child(2){background:#3ee08f}.px i:nth-child(3){background:#4c8dff}
.eyebrow{font-size:14px;letter-spacing:.08em;color:#9fb0ff;font-weight:600}
h1{font-size:34px;line-height:1.2;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:#c9d1ff;font-size:16px;line-height:1.5;margin:0 0 32px}
label{display:block;font-size:15px;color:#c9d1ff;margin-bottom:8px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:16px;border-radius:14px;border:1.5px solid #3b4592;background:rgba(255,255,255,.06);color:#fff;outline:none}
input:focus{border-color:#7381FF;background:rgba(255,255,255,.1)}
button{margin-top:14px;width:100%;font:inherit;font-size:18px;font-weight:700;padding:16px;border:0;border-radius:14px;background:#fff;color:#070C34;cursor:pointer}
button:active{transform:translateY(1px)}
.err{min-height:24px;margin-top:12px;color:#ff9aa5;font-size:15px}
.foot{margin-top:28px;font-size:13px;color:#7d87c4;line-height:1.6}
.loading{font-size:16px;color:#c9d1ff}
</style>
</head>
<body>
<div id="gate">
  <div class="wrap">
    <div class="px" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="eyebrow">차세대디스플레이 혁신융합대학사업단</div>
    <h1>WE-Meet in<br>CES 2027</h1>
    <p class="sub">참가자 통합 안내</p>
    <div id="form" hidden>
      <form id="f" autocomplete="off">
        <label for="pw">안내받은 비밀번호를 입력하세요</label>
        <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
        <button type="submit">열기</button>
        <div class="err" id="err" role="alert"></div>
      </form>
      <p class="foot">한 번 열면 이 휴대폰에서는 다음부터 자동으로 열리고,<br>인터넷이 없어도 볼 수 있어요.</p>
    </div>
    <p class="loading" id="loading">여는 중…</p>
  </div>
</div>
<script>
(() => {
  const KEY = 'wm.key'
  const $ = (id) => document.getElementById(id)
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  const toB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
  const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})

  let encP = null
  const getEnc = () => (encP ||= fetch('app.enc', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('load'); return r.json() }))

  async function decryptWith(key, enc) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(enc.iv) }, key, fromB64(enc.ct))
    return JSON.parse(new TextDecoder().decode(pt))
  }
  function run(p) {
    const st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st)
    document.body.innerHTML = '<div id="app"></div>'
    const sc = document.createElement('script'); sc.textContent = p.js; document.body.appendChild(sc)
  }
  function showForm(msg) {
    $('loading').hidden = true; $('form').hidden = false; $('err').textContent = msg || ''
    setTimeout(() => $('pw').focus(), 50)
  }

  async function boot() {
    let enc
    try { enc = await getEnc() } catch (e) { $('loading').textContent = '내용을 불러오지 못했어요. 인터넷 연결 후 다시 열어주세요.'; return }
    const saved = store.get(KEY)
    if (saved) {
      try {
        const key = await crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt'])
        return run(await decryptWith(key, enc))
      } catch (e) { store.del(KEY) }
    }
    showForm()
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault()
    const pw = $('pw').value.trim()
    $('err').textContent = '확인 중…'
    try {
      const enc = await getEnc()
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(enc.salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
      const p = await decryptWith(key, enc)
      store.set(KEY, toB64(await crypto.subtle.exportKey('raw', key)))
      run(p)
    } catch (e) {
      $('err').textContent = '비밀번호가 맞지 않아요. 다시 확인해 주세요.'
      $('pw').select()
    }
  })
  boot()
})()
</script>
</body>
</html>
