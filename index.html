<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CES 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WE-Meet CES 2027</title>
<style id="gate-css">
@font-face{font-family:'Pretendard';font-weight:45 920;font-display:swap;
  src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
html,body{margin:0;height:100%;background:#0B1238}
body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
#gate{position:relative;min-height:100%;display:flex;flex-direction:column;box-sizing:border-box;color:#fff;background:#0B1238;overflow:hidden}
/* 디스플레이 패널: CES 2027 을 R·G·B 서브픽셀 화소로 */
.panel{position:relative;margin:22px 0 0;padding:0 14px}
.panel canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.spec{display:flex;justify-content:space-between;max-width:460px;margin:10px auto 0;padding:0 24px;box-sizing:border-box;font-size:11.5px;letter-spacing:.06em;color:#6E79B8;font-variant-numeric:tabular-nums}
.head{position:relative;padding:calc(28px + env(safe-area-inset-top)) 24px 0;max-width:460px;width:100%;margin:0 auto;box-sizing:border-box}
.org{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:#B9C2F0}
.px{display:flex;gap:2px}.px i{width:3px;height:16px;border-radius:1.5px}
.px i:nth-child(1){background:#FF4D5E}.px i:nth-child(2){background:#20C77A}.px i:nth-child(3){background:#4C8DFF}
.spacer{flex:1;min-height:28px}
.body{position:relative;padding:0 24px calc(24px + env(safe-area-inset-bottom));max-width:460px;width:100%;margin:0 auto;box-sizing:border-box}
h1{font-size:40px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}
.sub{margin:6px 0 0;font-size:16px;color:#B9C2F0;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.meta span{font-size:13.5px;font-weight:600;color:#D6DCFA;background:rgba(255,255,255,.08);border-radius:8px;padding:5px 10px}
.formw{margin-top:28px}
label{display:block;font-size:14px;color:#C9D0F2;margin-bottom:8px;font-weight:600}
input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:16px;border-radius:14px;border:1px solid #2A3470;background:#121A4A;color:#fff;outline:none;letter-spacing:.04em}
input:focus{border-color:#4C7BFF;box-shadow:0 0 0 3px rgba(76,123,255,.25)}
button{margin-top:10px;width:100%;font:inherit;font-size:17px;font-weight:700;height:54px;border:0;border-radius:14px;background:#2253F5;color:#fff;cursor:pointer}
button:active{background:#1A43CF}
.err{min-height:20px;margin-top:10px;color:#FF9AA5;font-size:14.5px}
.foot{font-size:12.5px;color:#7782BE;line-height:1.6;margin:6px 0 0}
.loading{font-size:15px;color:#A9B3E8;margin-top:28px}
/* 화면 전환: 버튼 칸은 살짝 떠오르며 나타나고, 들어갈 때는 표지가 조용히 물러난다 */
.formw:not([hidden]){animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#gate.leave .head,#gate.leave .panel,#gate.leave .spec,#gate.leave .body{transition:opacity .2s ease,transform .24s cubic-bezier(.4,0,1,1);opacity:0;transform:translateY(-8px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate">
  <div class="head">
    <div class="org"><span class="px"><i></i><i></i><i></i></span>차세대디스플레이 혁신융합대학사업단</div>
  </div>
  <div class="panel"><canvas id="px" aria-label="CES 2027" role="img"></canvas></div>
  <div class="spec">LAS VEGAS · EUREKA PARK · 2027.01.06 – 09</div>
  <div class="spacer"></div>
  <div class="body">
    <h1>WE-Meet</h1>
    <p class="sub">in CES 2027 · 참가자 안내</p>
    <div class="meta"><span>1월 5일 – 12일</span><span>라스베이거스 · LA</span></div>
    <div id="start" class="formw" hidden>
      <button type="button" id="startBtn">시작하기</button>
      <p class="foot">처음 한 번만 안내받은 비밀번호가 필요해요.</p>
    </div>
    <div id="form" class="formw" hidden>
      <form id="f" autocomplete="off">
        <label for="pw">안내받은 비밀번호</label>
        <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
        <button type="submit">열기</button>
        <div class="err" id="err" role="alert"></div>
      </form>
      <p class="foot">한 번 열면 다음부터는 비밀번호 없이 열리고, 인터넷이 없어도 볼 수 있어요.</p>
    </div>
    <div id="go" class="formw" hidden>
      <button type="button" id="goBtn">시작하기</button>
      <p class="foot">이 휴대폰은 비밀번호 확인이 끝났어요.</p>
    </div>
    <p class="loading" id="loading">여는 중</p>
  </div>
</div>
<script>
(() => {
  const KEY = 'wm.key'
  const $ = (id) => document.getElementById(id)
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  const toB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
  const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} }

  // 디스플레이 패널: 5×7 화소 글꼴로 CES / 2027, 화소 하나 = R·G·B 서브픽셀 세 줄
  ;(function panel() {
    const F = {
      C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.'],
      E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
      S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
      2: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
      0: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
      7: ['#####', '....#', '...#.', '..#..', '.#...', '.#...', '.#...'],
    }
    const COLS = 25, ROWS = 18
    const lit = new Set()
    const put = (txt, row) => { const w = txt.length * 6 - 1; let x0 = 1 + Math.floor((23 - w) / 2); for (const ch of txt) { F[ch].forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') lit.add((row + y) * COLS + x0 + x) })); x0 += 6 } }
    put('CES', 1); put('2027', 10)
    const cv = document.getElementById('px'); if (!cv) return
    const ctx = cv.getContext('2d')
    const SUB = ['#FF5A6A', '#2BD889', '#5B97FF'], OFF = '#121A45'
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches
    let t0 = 0
    function draw(t) {
      const cssW = cv.parentElement.clientWidth - 28; const cell = Math.floor((cssW / COLS) * 2) / 2
      const dpr = Math.min(3, window.devicePixelRatio || 1)
      const W = Math.round(cell * COLS), H = Math.round(cell * ROWS)
      if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px' }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H)
      const sw = cell * 0.26, gap = cell * 0.04, sh = cell * 0.84, pad = (cell - (sw * 3 + gap * 2)) / 2, top = (cell - sh) / 2
      const prog = still ? 99 : (t - t0) / 700 // 왼쪽부터 켜짐(0.7초)
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const on = lit.has(y * COLS + x) && prog >= x / COLS
        for (let k = 0; k < 3; k++) {
          ctx.fillStyle = on ? SUB[k] : OFF
          ctx.fillRect(x * cell + pad + k * (sw + gap), y * cell + top, sw, sh)
        }
      }
      if (prog < 1.05) requestAnimationFrame(draw)
    }
    requestAnimationFrame((t) => { t0 = t; draw(t) })
    addEventListener('resize', () => requestAnimationFrame((t) => { t0 = t - 99999; draw(t) }))
  })()

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
  // 안드로이드 크롬의 '홈 화면에 추가' 신호는 일찍 오므로 여기서 받아 두고 앱이 꺼내 쓴다
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__bip = e })

  let encP = null
  const getEnc = () => (encP ||= fetch('app.enc', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('load'); return r.json() }))

  async function decryptWith(key, enc) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(enc.iv) }, key, fromB64(enc.ct))
    return JSON.parse(new TextDecoder().decode(pt))
  }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches
  // 표지를 먼저 물리고(0.2초) 앱을 연 다음, 남색 막을 걷어 내듯 앱이 드러나게
  function run(p) {
    if (calm) return open(p)
    $('gate').classList.add('leave')
    setTimeout(() => open(p), 200)
  }
  function open(p) {
    document.getElementById('gate-css')?.remove() // 잠금 화면 전용 스타일이 앱 화면에 섞이지 않게
    document.querySelector('meta[name=theme-color]')?.setAttribute('content', '#ffffff')
    const st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st)
    document.body.innerHTML = '<div id="app"></div>'
    const sc = document.createElement('script'); sc.textContent = p.js; document.body.appendChild(sc)
    if (calm) return
    const veil = document.createElement('div')
    veil.style.cssText = 'position:fixed;inset:0;z-index:100;background:#0B1238;pointer-events:none;transition:opacity .38s cubic-bezier(.2,.8,.2,1)'
    document.body.appendChild(veil)
    document.querySelector('#app main')?.classList.add('in-tab') // 내용만 떠오르게(#app을 움직이면 아래 탭 막대까지 따라 움직임)
    requestAnimationFrame(() => requestAnimationFrame(() => { veil.style.opacity = '0' }))
    setTimeout(() => veil.remove(), 450)
  }
  // 처음 여는 휴대폰: 표지만 보여 주고, '시작하기'를 눌러야 비밀번호 칸이 나온다(키보드도 그때)
  function showForm() {
    $('loading').hidden = true; $('start').hidden = false
    $('startBtn').addEventListener('click', () => {
      $('start').hidden = true; $('form').hidden = false; $('err').textContent = ''
      $('pw').focus()
    }, { once: true })
  }

  async function boot() {
    let enc
    try { enc = await getEnc() } catch (e) { $('loading').textContent = '내용을 불러오지 못했어요. 인터넷 연결 후 다시 열어주세요.'; return }
    const saved = store.get(KEY)
    if (saved) {
      try {
        const key = await crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt'])
        const p = await decryptWith(key, enc)
        // 첫 화면은 매번 보여주고, '시작하기'를 눌러야 넘어간다
        $('loading').hidden = true; $('go').hidden = false
        $('goBtn').addEventListener('click', () => run(p), { once: true })
        return
      } catch (e) { store.del(KEY) }
    }
    showForm()
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault()
    const pw = $('pw').value.trim()
    $('err').textContent = '확인 중…'
    try {
      const enc = await getEnc()
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(enc.salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
      const p = await decryptWith(key, enc)
      store.set(KEY, toB64(await crypto.subtle.exportKey('raw', key)))
      run(p)
    } catch (e) {
      $('err').textContent = '비밀번호가 맞지 않아요. 다시 확인해 주세요.'
      $('pw').select()
    }
  })
  boot()
})()
</script>
</body>
</html>
